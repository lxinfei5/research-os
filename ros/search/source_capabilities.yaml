# ResearchOS source capability policy. This file does NOT define truth or credibility — it defines
# the operational ACQUISITION POLICY for each source: which collector (fetch mechanism) is required
# or forbidden, the search entry, and media/failure behavior. capabilities.py enforces it at capture
# time (the unbypassable gate). Ported/adapted from AStockOS control_plane/intake/source_capabilities.yaml.
#
# HARD CONSTRAINT (the reason this file exists for ResearchOS): all Xiaohongshu (小红书) search +
# note detail MUST go through the local xiaohongshu-mcp server. kimi-webbridge / browser /
# webbridge-mcp are FORBIDDEN for XHS search. See methodology/xiaohongshu_search_playbook.md.
#
# webbridge-mcp (:18061) is the MCP proxy that fronts the Kimi WebBridge real-Chrome daemon so
# workflow SUB-AGENTS can drive X / 抖音 / login-gated web (a skill can't propagate to sub-agents).
# It is an equal peer of the kimi-webbridge SKILL — same real browser session, different transport
# (MCP = sub-agent reachable; skill = main-loop only). Both are allowed wherever the real browser is
# allowed (x / douyin / web fetch-Tier-3) and both are FORBIDDEN for xiaohongshu (crown-jewel).

sources:

  # ── Public web / multi-engine ────────────────────────────────────────────
  # Two 3-tier fallback chains (full protocol: methodology/web_search_provider_playbook.md):
  #   search: zhipu web-search-prime → runtime WebSearch → multi-search-engine skill (quota-free)
  #   fetch:  zhipu web-reader       → runtime WebFetch   → kimi-webbridge browser snapshot
  #                                                          (JS/anti-bot/login pages ONLY)
  # `collector` records the tier that produced the captured items; the full chain goes in
  # raw_tool_status.fallback_chain. All tier collectors are whitelisted below so the gate passes;
  # kimi-webbridge here is the fetch-Tier-3 browser reader (NOT a search collector for web).
  web:
    coverage: public_web
    required_search_collector: [runtime-builtin, web_search, multi-search-engine, zhipu, web-reader, kimi-webbridge, webbridge-mcp]
    collector_optional: true            # web captures may omit collector (any allowed tier)
    search_entry: "tool:WebSearch"
    media_to_text: not_applicable

  # Alias bucket for explicit search-engine captures (same policy as web).
  web_search:
    coverage: public_web
    required_search_collector: [runtime-builtin, web_search, multi-search-engine, zhipu, web-reader, kimi-webbridge, webbridge-mcp]
    collector_optional: true
    search_entry: "tool:WebSearch"

  # ── X / Twitter ──────────────────────────────────────────────────────────
  x:
    # Both drive the user's real Chrome/login: webbridge-mcp (:18061, sub-agent reachable) OR the
    # kimi-webbridge skill (main-loop only). twscrape / independent x-mcp were rejected (§四·1).
    required_search_collector: [webbridge-mcp, kimi-webbridge]
    coverage: named_kol_social_signal
    # &src=typed_query&f=live = the Latest/live feed (freshness-sensitive), matching social_access_playbook.md
    search_entry_url: "https://x.com/search?q={query}&src=typed_query&f=live"
    public_search_only: true
    media_to_text: not_applicable

  # ── Douyin 抖音 ───────────────────────────────────────────────────────────
  douyin:
    coverage: anonymous_short_video_signal
    required_search_collector: [webbridge-mcp, kimi-webbridge]
    search_entry_url: "https://www.douyin.com/search/{query}"
    public_search_only: true
    media_url_collector: [webbridge-mcp, kimi-webbridge]
    media_to_text: whisper                # video → text before retention (Phase 2)

  # ── Xiaohongshu 小红书 — THE hard constraint ──────────────────────────────
  xiaohongshu:
    coverage: high_density_social_private_signal
    required_search_collector: xiaohongshu-mcp
    preferred_search_collector: xiaohongshu-mcp
    # ✱ unbypassable ✱ — every general browser bridge is forbidden for XHS search/detail, whether it
    # reaches the browser as a SKILL (kimi-webbridge) or as an MCP (webbridge-mcp). Only xiaohongshu-mcp.
    forbidden_search_collectors: [kimi-webbridge, browser, webbridge-mcp]
    search_entry: "tool:search_feeds"
    non_search_browser_allowed: false
    # favorites (Phase 2): list cards may use kimi-webbridge for metadata ONLY; detail must use mcp.
    favorites_list_collector: kimi-webbridge
    favorites_detail_collector: xiaohongshu-mcp
    favorites_browser_detail_allowed: false
    media_to_text: [zai-mcp-ocr, whisper]  # image-heavy notes → OCR/vision text (Phase 2)

  # ── Manual / misc ─────────────────────────────────────────────────────────
  manual:
    coverage: manual_entry
    collector_optional: true
